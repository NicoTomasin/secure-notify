# SPDX-License-Identifier: AGPL-3.0-or-later
# Supply chain checks (docs/architecture/security.md#supply-chain). Licenses must be compatible
# with AGPL-3.0-or-later (docs/product/licensing.md#source-files-and-packages).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# Workspace crates are not published; their licenses are declared in their manifests.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # TLS uses rustls; OpenSSL is not linked (docs/engineering/conventions.md#dependencies).
    { name = "openssl-sys" },
    { name = "openssl" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
