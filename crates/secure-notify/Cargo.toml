[package]
name = "secure-notify"
description = "Self-hosted notification bot for security and reliability events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Development-only tools: the console platform and the development clock
# (docs/engineering/local-development.md#development-only-features).
dev = []

[dependencies]
clap = { workspace = true }
dotenvy = { workspace = true }
getrandom = { workspace = true }
secure-notify-conversation = { workspace = true }
secure-notify-declarative = { workspace = true }
secure-notify-plugin-host = { workspace = true }
secure-notify-source-osv = { workspace = true }
serde_json = { workspace = true }
secure-notify-parser-bun = { workspace = true }
secure-notify-parser-npm = { workspace = true }
secure-notify-parser-pnpm = { workspace = true }
secure-notify-core = { workspace = true }
secure-notify-model = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
jiff = { workspace = true }
secure-notify-storage = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "fs"] }

[dev-dependencies]
tempfile = { workspace = true }
