# SPDX-License-Identifier: AGPL-3.0-or-later

[workspace]
resolver = "3"
members = [
    "crates/secure-notify",
    "crates/core",
    "crates/model",
    "crates/storage",
    "crates/plugin-host",
    "crates/declarative",
    "crates/conversation",
    "crates/versions",
    "crates/web",
    "xtask",
]
default-members = ["crates/secure-notify"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# MSRV: latest stable minus two minor releases (docs/engineering/conventions.md#rust).
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/NicoTomasin/secure-notify"
publish = false

[workspace.dependencies]
# Workspace crates
secure-notify-core = { path = "crates/core" }
secure-notify-model = { path = "crates/model" }
secure-notify-storage = { path = "crates/storage" }

# Third-party crates
dotenvy = { version = "0.15" }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json", "ansi"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
insta = { version = "1" }
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
tempfile = { version = "3" }
tokio = { version = "1", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
schemars = { version = "1", default-features = false, features = ["std", "derive", "jiff02"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
semicolon_if_nothing_returned = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
