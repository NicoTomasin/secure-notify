# SPDX-License-Identifier: AGPL-3.0-or-later
# License check for the permissively licensed crates: their dependencies MUST be permissive
# (docs/product/licensing.md#source-files-and-packages).

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true
